# INJECTION_LAB — docker-compose
#
# SETUP
# ─────────────────────────────────────────────────────────────────────────────
# 1. Copy .env.example to .env and fill in your values:
#      cp .env.example .env
#
# 2. Set LAB_PASSWORD — students enter this on the login screen.
#    The username is a display name each student picks themselves.
# ─────────────────────────────────────────────────────────────────────────────

version: '3.8'

services:
  backend:
    build: ./backend
    env_file:
      - .env
    expose:
      - "3000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    command: nginx -g 'daemon off;'
    ports:
      - "80:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
